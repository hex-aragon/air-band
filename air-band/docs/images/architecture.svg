<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="'Malgun Gothic','Noto Sans KR',system-ui,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>

  <!-- 입력 -->
  <rect x="20" y="40" width="190" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="115" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">6축 IMU</text>
  <text x="115" y="96" text-anchor="middle" font-size="13" fill="#64748b">I2C · 100Hz (미연결)</text>

  <rect x="20" y="170" width="190" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="202" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">보드 버튼 1~4</text>
  <text x="115" y="226" text-anchor="middle" font-size="13" fill="#1e40af">GPIO · 디바운스 25ms</text>

  <!-- 보드 -->
  <rect x="270" y="30" width="250" height="230" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="395" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">NU40 DK (nRF52840)</text>
  <text x="395" y="100" text-anchor="middle" font-size="14" fill="#334155">피크 감지 / 버튼 엣지</text>
  <text x="395" y="126" text-anchor="middle" font-size="14" fill="#334155">→ 드럼 클래스 · 세기</text>
  <text x="395" y="166" text-anchor="middle" font-size="14" fill="#334155">FreeRTOS 큐 (대기 0)</text>
  <text x="395" y="192" text-anchor="middle" font-size="14" fill="#334155">→ BLE 전송 태스크</text>
  <text x="395" y="236" text-anchor="middle" font-size="13" fill="#64748b">8바이트 패킷</text>

  <!-- 브라우저 -->
  <rect x="620" y="30" width="320" height="230" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="780" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">브라우저 (Chrome / Edge)</text>
  <text x="780" y="102" text-anchor="middle" font-size="14" fill="#166534">Web Bluetooth · notify 수신</text>
  <text x="780" y="140" text-anchor="middle" font-size="14" fill="#166534">Web Audio · 미리 만든 버퍼 start()</text>
  <text x="780" y="178" text-anchor="middle" font-size="14" fill="#166534">Canvas · 물결 이펙트</text>
  <text x="780" y="216" text-anchor="middle" font-size="14" fill="#166534">지연 · 지터 표시</text>

  <!-- 화살표 -->
  <line x1="210" y1="80" x2="266" y2="110" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="210" y1="210" x2="266" y2="180" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="520" y1="145" x2="616" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="568" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">BLE</text>
  <text x="568" y="168" text-anchor="middle" font-size="12" fill="#64748b">NUS notify</text>
</svg>
