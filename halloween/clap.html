<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박수 호박 사탕</title>
<style>
  :root { --bg:#14100c; --fg:#fff4e6; --or:#ff7a1a; --dim:#a08670; --ok:#5fd38d; --line:#5a4430; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:4px 0 12px; }
  .grid { display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; align-items:center; }
  button { font:inherit; padding:10px 14px; border-radius:10px; border:1px solid var(--line);
    background:#2a1f16; color:var(--fg); cursor:pointer; }
  button.main { background:var(--or); border-color:var(--or); color:#1a0e04; font-weight:700; }
  label { font-size:14px; color:var(--dim); }
  .st b { color:var(--dim); } .st b.on { color:var(--ok); }
  #stage { position:relative; width:100%; aspect-ratio:4/3; background:#000; border-radius:14px; overflow:hidden; }
  video, #overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #hint { position:absolute; left:0; right:0; bottom:12px; text-align:center; font-size:22px; font-weight:800;
    text-shadow:0 2px 6px #000; padding:0 12px; }
  #claps { position:absolute; top:12px; left:0; right:0; display:flex; justify-content:center; gap:14px; }
  .dot { width:46px; height:46px; border-radius:50%; border:3px solid #fff8; display:flex; align-items:center;
    justify-content:center; font-size:26px; background:#0006; transition:transform .1s; }
  .dot.on { background:var(--or); border-color:var(--or); transform:scale(1.15); }
  /* 호박 */
  #pumpkinBox { position:relative; background:#0c0907; border-radius:14px; aspect-ratio:1/1; overflow:hidden;
    display:flex; align-items:center; justify-content:center; }
  #pumpkin { font-size:min(40vw, 220px); line-height:1; transition:transform .15s; user-select:none; }
  #pumpkin.spit { animation: spit .7s ease-out; }
  @keyframes spit { 0%{transform:scale(1)} 25%{transform:scale(1.18) rotate(-4deg)} 60%{transform:scale(.95)} 100%{transform:scale(1)} }
  .candy { position:absolute; left:50%; top:58%; font-size:44px; pointer-events:none;
    animation: fly 1.4s cubic-bezier(.2,.7,.4,1) forwards; }
  @keyframes fly { from { transform:translate(-50%,0) scale(.4); opacity:1 }
    to { transform:translate(calc(-50% + var(--dx)), var(--dy)) rotate(var(--rot)) scale(1); opacity:0 } }
  #count { position:absolute; bottom:10px; right:14px; color:var(--dim); font-size:14px; }
  .meter { height:10px; background:#2a1f16; border-radius:6px; overflow:hidden; flex:1; min-width:120px; position:relative; }
  .meter i { position:absolute; inset:0 auto 0 0; background:var(--or); width:0; }
  .meter s { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ok); }
  #log { font:12px/1.5 ui-monospace,monospace; color:var(--dim); white-space:pre-wrap; max-height:160px; overflow:auto;
    background:#0c0907; padding:8px; border-radius:8px; margin-top:8px; }
  .box { background:#1c1510; border:1px solid #2e2218; border-radius:12px; padding:10px 12px; margin-top:10px; }
  .box h2 { font-size:15px; margin:0 0 6px; color:var(--dim); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>🎃 박수 두 번 → 호박이 사탕을 뱉어요</h1>

  <div class="row">
    <button id="camBtn" class="main">① 카메라 켜기</button>
    <button id="usbBtn" class="main">② 아두이노 연결 (USB)</button>
    <button id="btBtn">또는 누코드 연결 (블루투스)</button>
    <span class="st">호박: <b id="linkSt">연결 안 됨 (화면에서만 사탕)</b></span>
  </div>

  <div class="grid">
    <div>
      <div id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="claps"><div class="dot" id="c1">👏</div><div class="dot" id="c2">👏</div></div>
        <div id="hint">카메라를 켜 주세요</div>
      </div>
      <div class="box">
        <h2>감지 방법</h2>
        <div class="row">
          <label><input type="checkbox" id="useCam" checked> 카메라 (두 손이 맞닿음)</label>
          <label><input type="checkbox" id="useMic"> 소리 (짝! 소리)</label>
          <label>스페이스 키 = 박수 (시험용)</label>
        </div>
        <div class="row">
          <label style="width:110px">손 사이 거리</label>
          <div class="meter"><i id="handBar"></i><s id="handMark"></s></div>
          <label>민감도 <input type="range" id="camSens" min="0.8" max="2.2" step="0.05" value="1.4"></label>
          <label id="handNum" style="width:120px">손 0개</label>
        </div>
        <div class="row">
          <label style="width:110px">소리 크기</label>
          <div class="meter"><i id="micBar"></i><s id="micMark"></s></div>
          <label>민감도 <input type="range" id="micSens" min="0.05" max="0.6" step="0.01" value="0.25"></label>
        </div>
      </div>
    </div>

    <div>
      <div id="pumpkinBox">
        <div id="pumpkin">🎃</div>
        <div id="count">사탕 0개</div>
      </div>
      <div class="row">
        <label>박수 두 번 하면
          <select id="clapCmd">
            <option value="g">사탕 + 보드 불 깜빡</option>
            <option value="b">보드 불만 깜빡 (모터 없이)</option>
          </select></label>
      </div>
      <div class="row">
        <button id="giveBtn">사탕 주기 (수동)</button>
        <button data-cmd="b">불 깜빡</button>
        <button data-cmd="o">문 열기</button>
        <button data-cmd="c">문 닫기</button>
        <button data-cmd="+">열림 +5°</button>
        <button data-cmd="-">열림 -5°</button>
        <button data-cmd="?">상태</button>
      </div>
      <div id="log"></div>
    </div>
  </div>
</main>

<script type="module">
import { HandLandmarker, FilesetResolver, DrawingUtils }
  from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const $ = (id) => document.getElementById(id);
const logEl = $('log');
const log = (s) => { logEl.textContent = `${new Date().toLocaleTimeString()} ${s}\n` + logEl.textContent; };

// 박수 두 번 규칙: 두 박수 사이 0.12~1.2초, 사탕 뒤 4초는 쉼
const DOUBLE_MIN_MS = 120, DOUBLE_MAX_MS = 1200, COOLDOWN_MS = 4000, MERGE_MS = 180;

// ================= 보드 연결: 블루투스(NUS) 또는 USB 시리얼 =================
const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // 보드 → 웹 (notify)
const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // 웹 → 보드 (write)
let sendRaw = null;   // (문자열) => Promise

function setLink(text, on) { $('linkSt').textContent = text; $('linkSt').className = on ? 'on' : ''; }

$('btBtn').onclick = async () => {
  if (!navigator.bluetooth) { log('이 브라우저는 블루투스 연결이 안 됩니다. 크롬이나 엣지로 열어 주세요'); return; }
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'Pumpkin' }], optionalServices: [NUS_SERVICE] });
    device.addEventListener('gattserverdisconnected', () => { sendRaw = null; setLink('끊김', false); log('블루투스 끊김'); });
    const svc = await (await device.gatt.connect()).getPrimaryService(NUS_SERVICE);
    const rx = await svc.getCharacteristic(NUS_RX);
    const tx = await svc.getCharacteristic(NUS_TX);
    await tx.startNotifications();
    const dec = new TextDecoder();
    let btBuf = '';
    tx.addEventListener('characteristicvaluechanged', (e) => {
      btBuf += dec.decode(e.target.value);
      let i;
      while ((i = btBuf.indexOf('\n')) >= 0) { const line = btBuf.slice(0, i).trim(); btBuf = btBuf.slice(i + 1); if (line) log('호박: ' + line); }
    });
    sendRaw = (s) => rx.writeValue(new TextEncoder().encode(s));
    setLink(device.name + ' (블루투스)', true);
    log('연결됨: ' + device.name);
    send('?');
  } catch (e) { log('블루투스 연결 실패: ' + e.message); }
};

$('usbBtn').onclick = async () => {
  if (!navigator.serial) { log('이 브라우저는 USB 시리얼이 안 됩니다. 크롬이나 엣지로 열어 주세요'); return; }
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    const writer = port.writable.getWriter();
    sendRaw = (s) => writer.write(new TextEncoder().encode(s));
    setLink('USB 연결됨 (준비 중…)', true);
    log('USB 연결됨 — 아두이노 UNO는 연결하면 재시작되므로 2초 기다림');
    (async () => {   // 보드 응답 읽기
      const reader = port.readable.pipeThrough(new TextDecoderStream()).getReader();
      let buf = '';
      try {
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          let i;
          while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (line) log('호박: ' + line); }
        }
      } catch { /* 케이블 뽑힘 */ }
      sendRaw = null; setLink('USB 끊김', false);
    })();
    await new Promise((r) => setTimeout(r, 2000));
    setLink('USB 연결됨', true);
    send('?');
  } catch (e) { log('USB 연결 실패: ' + e.message + ' (아두이노 IDE 시리얼 모니터가 켜져 있으면 끄세요)'); }
};

async function send(cmd) {
  if (!sendRaw) { log(`(호박 연결 안 됨) 명령 ${cmd}`); return false; }
  try { await sendRaw(cmd); return true; } catch (e) { log('보내기 실패: ' + e.message); return false; }
}
document.querySelectorAll('[data-cmd]').forEach((b) => b.onclick = () => send(b.dataset.cmd));

// ================= 호박 화면 =================
let candyCount = 0, lastGive = -1e9;
function giveCandy(reason) {
  const now = performance.now();
  if (now - lastGive < COOLDOWN_MS) return;
  lastGive = now;
  candyCount++;
  $('count').textContent = `사탕 ${candyCount}개`;
  log(`사탕! (${reason})`);
  send($('clapCmd').value);
  const p = $('pumpkin');
  p.classList.remove('spit'); void p.offsetWidth; p.classList.add('spit');
  const box = $('pumpkinBox');
  for (let i = 0; i < 7; i++) {
    const c = document.createElement('div');
    c.className = 'candy';
    c.textContent = ['🍬', '🍭', '🍫'][i % 3];
    c.style.setProperty('--dx', `${(Math.random() - 0.5) * 320}px`);
    c.style.setProperty('--dy', `${60 + Math.random() * 120}px`);
    c.style.setProperty('--rot', `${(Math.random() - 0.5) * 720}deg`);
    c.style.animationDelay = `${i * 50}ms`;
    box.appendChild(c);
    setTimeout(() => c.remove(), 1600 + i * 50);
  }
}
$('giveBtn').onclick = () => giveCandy('수동');

// ================= 박수 세기 (카메라 · 소리 · 키보드 공통) =================
let claps = [];          // 최근 박수 시각
let lastClapAt = -1e9;
function onClap(source) {
  const now = performance.now();
  if (now - lastClapAt < MERGE_MS) return;        // 카메라와 소리가 같은 박수를 둘 다 잡은 경우
  lastClapAt = now;
  if (now - lastGive < COOLDOWN_MS) return;
  claps = claps.filter((t) => now - t < DOUBLE_MAX_MS);
  if (claps.length && now - claps[claps.length - 1] < DOUBLE_MIN_MS) return;
  claps.push(now);
  log(`박수 ${claps.length} (${source})`);
  if (claps.length >= 2) { claps = []; giveCandy('박수 두 번'); }
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); onClap('키보드'); }
});

function updateClapDots() {
  const now = performance.now();
  const live = claps.filter((t) => now - t < DOUBLE_MAX_MS).length;
  $('c1').classList.toggle('on', live >= 1);
  $('c2').classList.toggle('on', live >= 2);
  const cooling = now - lastGive < COOLDOWN_MS;
  $('hint').textContent = cooling ? '🍬 맛있게 드세요!'
    : live === 1 ? '한 번 더! 👏'
    : !video.srcObject && !mic ? '카메라를 켜 주세요'
    : '박수를 두 번 쳐 보세요 👏👏';
}

// ================= 카메라: 두 손바닥이 가까워졌다 맞닿는 순간 =================
const video = $('video'), overlay = $('overlay'), ctx = overlay.getContext('2d');
let landmarker = null;

async function loadModel() {
  if (landmarker) return;
  $('hint').textContent = '손 인식 모델 불러오는 중…';
  const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath:
      'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      delegate },
    runningMode: 'VIDEO', numHands: 2,
    minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4, minTrackingConfidence: 0.4 });
  try { landmarker = await HandLandmarker.createFromOptions(files, opts('GPU')); }
  catch { landmarker = await HandLandmarker.createFromOptions(files, opts('CPU')); }
}

$('camBtn').onclick = async () => {
  if (video.srcObject || $('camBtn').disabled) return;
  $('camBtn').disabled = true;
  try {
    await loadModel();
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
    await video.play();
    $('camBtn').textContent = '① 카메라 켜짐';
    log('카메라 켜짐');
  } catch (e) {
    video.srcObject = null; $('camBtn').disabled = false;
    $('hint').textContent = '카메라 오류: ' + e.message; log('카메라 오류: ' + e.message);
  }
};

// 손바닥 가운데(손목 + 손가락 뿌리 4개 평균)와 손 크기(손목~가운뎃손가락 뿌리)
function palm(lm) {
  const ids = [0, 5, 9, 13, 17];
  const x = ids.reduce((s, i) => s + lm[i].x, 0) / ids.length;
  const y = ids.reduce((s, i) => s + lm[i].y, 0) / ids.length;
  const size = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y);
  return { x, y, size };
}

// 박수 판정. 거리 = 두 손바닥 사이 / 손 크기.
// ① 두 손이 다 보이는 채로 거리가 민감도 아래로 내려가면 박수
// ② 빠르게 치면 손이 겹치거나 흐려져서 인식기가 한 손(또는 두 손)을 놓친다.
//    두 손이 다가오던 중(거리가 줄던 중) 0.3초 안에 손이 사라지면 그것도 박수로 센다.
// 다시 세려면 두 손이 (민감도 + 0.5) 넘게 벌어져야 한다.
class ClapDetector {
  constructor() { this.armed = true; this.last2 = null; }
  // t: ms, palms: [{x, y, size}, ...], close: 민감도 → 박수면 true
  step(t, palms, close) {
    const rearm = close + 0.5;
    if (palms.length >= 2) {
      const [a, b] = palms;
      const d = Math.hypot(a.x - b.x, a.y - b.y) / ((a.size + b.size) / 2);
      const prev = this.last2 && t - this.last2.t < 300 ? this.last2.d : Infinity;
      this.last2 = { t, d, closing: d < prev - 0.05 };
      if (d > rearm) this.armed = true;
      if (this.armed && d < close) { this.armed = false; return true; }
      return false;
    }
    const l = this.last2;
    if (this.armed && l && t - l.t < 300 && l.d < close + 1.8 && (l.closing || l.d < rearm)) {
      this.armed = false; this.last2 = null; return true;
    }
    return false;
  }
  get distance() { return this.last2 ? this.last2.d : null; }
}
window.ClapDetector = ClapDetector;   // 시험용
const clapDet = new ClapDetector();
let lastVideoTime = -1;

function camStep(now) {
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  const res = landmarker.detectForVideo(video, now);
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  const draw = new DrawingUtils(ctx);
  for (const lm of res.landmarks) {
    draw.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS, { color: '#ff7a1a', lineWidth: 3 });
    draw.drawLandmarks(lm, { color: '#fff4e6', radius: 3 });
  }
  const close = parseFloat($('camSens').value);
  $('handMark').style.left = `${(close / 3) * 100}%`;
  if (!$('useCam').checked) return;

  const palms = res.landmarks.map(palm);
  if (clapDet.step(now, palms, close)) onClap('카메라');
  const d = palms.length >= 2 ? clapDet.distance : null;
  $('handBar').style.width = d == null ? '0' : `${Math.min(1, d / 3) * 100}%`;
  $('handNum').textContent = `손 ${palms.length}개` + (d == null ? '' : ` · 거리 ${d.toFixed(1)}`);
}

// ================= 소리: 짧고 큰 소리(짝!) =================
let mic = null, micBuf = null, micFloor = 0.01, lastMicClap = -1e9;
$('useMic').onchange = async () => {
  if (!$('useMic').checked || mic) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const ac = new AudioContext();
    mic = ac.createAnalyser();
    mic.fftSize = 1024;
    ac.createMediaStreamSource(stream).connect(mic);
    micBuf = new Float32Array(mic.fftSize);
    log('마이크 켜짐');
  } catch (e) { $('useMic').checked = false; log('마이크 오류: ' + e.message); }
};

function micStep(now) {
  if (!mic) return;
  mic.getFloatTimeDomainData(micBuf);
  let peak = 0;
  for (const v of micBuf) peak = Math.max(peak, Math.abs(v));
  const th = parseFloat($('micSens').value);
  $('micBar').style.width = `${Math.min(1, peak) * 100}%`;
  $('micMark').style.left = `${th * 100}%`;
  if (!$('useMic').checked) return;
  // 평소 소리(바닥)보다 훨씬 크고, 기준보다 크면 박수
  if (peak > th && peak > micFloor * 5 && now - lastMicClap > 150) { lastMicClap = now; onClap('소리'); }
  micFloor = micFloor * 0.98 + Math.min(peak, th) * 0.02;
}

function loop(now) {
  camStep(now);
  micStep(now);
  updateClapDots();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
