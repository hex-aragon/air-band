<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Air Band 지휘</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #16181d;
        --dim: #6b7280;
        --line: #e3e5ea;
        --accent: #2563eb;
        --ok: #16a34a;
        --warn: #b45309;
        --warn-bg: #fef3c7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --panel: #171a20;
          --text: #e8eaef;
          --dim: #8b93a1;
          --line: #262a33;
          --accent: #60a5fa;
          --ok: #4ade80;
          --warn: #fbbf24;
          --warn-bg: #3a2c0a;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      h1 { font-size: 17px; margin: 0 8px 0 0; }
      button, .btn {
        font: inherit;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        text-decoration: none;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }
      .meta { color: var(--dim); font-size: 13px; }
      .meta b { color: var(--text); font-weight: 600; }
      #status[data-state='connected'] { color: var(--ok); }
      .spacer { flex: 1; }
      #support { margin: 0; padding: 10px 16px; background: var(--warn-bg); color: var(--warn); }
      /* 무대는 테마와 상관없이 어둡게 (공연장 느낌, 파트 색이 잘 보이도록) */
      #stage { flex: 1; position: relative; min-height: 0; background: #07080b; color: #e8eaef; }
      #hall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      .hud { position: absolute; top: 14px; left: 16px; display: flex; gap: 22px; pointer-events: none; }
      .hud div { display: flex; flex-direction: column; }
      .hud small { color: #8b93a1; font-size: 12px; }
      .hud b { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
      .song { position: absolute; top: 14px; right: 16px; text-align: right; pointer-events: none; }
      .song b { display: block; font-size: 16px; }
      .song small { color: #8b93a1; }
      #message {
        position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
        max-width: min(640px, calc(100% - 32px)); text-align: center;
        background: rgba(15, 17, 21, 0.82); border: 1px solid #262a33; border-radius: 12px;
        padding: 12px 18px; font-size: 16px;
      }
      #message small { display: block; color: #8b93a1; font-size: 13px; margin-top: 4px; }
      .progress { position: absolute; left: 16px; right: 16px; bottom: 20px; height: 6px; background: #1c2029; border-radius: 3px; overflow: hidden; }
      .progress span { display: block; height: 100%; width: 0; background: #60a5fa; }
      footer.credit { padding: 6px 16px; font-size: 12px; color: var(--dim); background: var(--panel); border-top: 1px solid var(--line); }
      footer.credit a { color: inherit; }
      @media (max-width: 560px) {
        header { padding: 10px 12px; gap: 8px; }
        h1 { font-size: 15px; }
        button, .btn { padding: 6px 10px; font-size: 14px; }
        .hide-sm { display: none; }
        .hud { gap: 14px; }
        .hud b { font-size: 20px; }
        .song { display: none; }
      }
    </style>
    <script type="module" crossorigin src="./assets/conduct-CvukGVmQ.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/ble-CvFzc0d1.js">
  </head>
  <body>
    <header>
      <h1>🎼 Air Band 지휘</h1>
      <button id="connect" class="primary">센서 연결</button>
      <button id="phone" title="보드 없이 이 폰을 지휘봉처럼 쥐기 (폰에서만)">📱 폰으로 지휘</button>
      <button id="recenter" disabled title="키보드 C — 지휘봉을 정면(오케스트라 가운데)으로 겨누고 누르기">정면 맞추기</button>
      <button id="restart" title="키보드 R">처음부터</button>
      <span class="meta">상태 <b id="status" data-state="disconnected">연결 안 됨</b></span>
      <span class="spacer"></span>
      <a class="btn hide-sm" href="./">자유 연주</a>
      <a class="btn hide-sm" href="kit.html">드럼 키트</a>
      <a class="btn hide-sm" href="rhythm.html">리듬 게임</a>
    </header>
    <div id="support" hidden></div>
    <main id="stage">
      <canvas id="hall"></canvas>
      <div class="hud">
        <div><small>템포</small><b id="bpm">—</b></div>
        <div><small>셈여림</small><b id="dyn">—</b></div>
        <div><small>마디</small><b id="bar">—</b></div>
      </div>
      <div class="song"><b id="title"></b><small id="composer"></small></div>
      <div id="message">불러오는 중…</div>
      <div class="progress"><span id="progress"></span></div>
    </main>
    <footer class="credit">
      악기 소리: FluidR3 GM (Frank Wen, MIT) ·
      <a href="https://github.com/gleitz/midi-js-soundfonts" target="_blank" rel="noopener">midi-js-soundfonts</a> (CC BY 3.0) ·
      곡: 퍼블릭 도메인, 편곡 Air Band
    </footer>
  </body>
</html>
