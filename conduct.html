<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Air Band 지휘</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #16181d;
        --dim: #6b7280;
        --line: #e3e5ea;
        --accent: #2563eb;
        --ok: #16a34a;
        --warn: #b45309;
        --warn-bg: #fef3c7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --panel: #171a20;
          --text: #e8eaef;
          --dim: #8b93a1;
          --line: #262a33;
          --accent: #60a5fa;
          --ok: #4ade80;
          --warn: #fbbf24;
          --warn-bg: #3a2c0a;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      h1 { font-size: 17px; margin: 0 8px 0 0; }
      button, .btn {
        font: inherit;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        text-decoration: none;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }
      .meta { color: var(--dim); font-size: 13px; }
      .meta b { color: var(--text); font-weight: 600; }
      #status[data-state='connected'] { color: var(--ok); }
      .spacer { flex: 1; }
      #support { margin: 0; padding: 10px 16px; background: var(--warn-bg); color: var(--warn); }
      /* 무대는 테마와 상관없이 어둡게 (공연장 느낌, 파트 색이 잘 보이도록) */
      #stage { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #07080b; color: #e8eaef; }
      .hallwrap { flex: 1; position: relative; min-height: 0; }
      #hall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #score { display: block; width: 100%; height: 132px; border-top: 1px solid #1c2029; }
      .modes { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; background: #151820; border: 1px solid #262a33; border-radius: 10px; padding: 3px; }
      .modes button { background: transparent; border: 0; color: #8b93a1; padding: 6px 14px; border-radius: 7px; white-space: nowrap; }
      .modes button[aria-pressed='true'] { background: #2563eb; color: #fff; }
      .practice { position: absolute; top: 78px; left: 16px; display: flex; flex-direction: column; gap: 8px; background: rgba(15, 17, 21, 0.82); border: 1px solid #262a33; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
      .practice[hidden] { display: none; }
      .practice label { display: flex; align-items: center; gap: 8px; color: #c7ccd6; cursor: pointer; }
      .practice input[type='range'] { width: 120px; }
      .practice button { background: #2563eb; border-color: #2563eb; color: #fff; }
      .judge { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; font-weight: 800; pointer-events: none; text-shadow: 0 2px 8px #000; }
      .lesson { text-align: left; }
      .lesson ol { margin: 6px 0 0; padding-left: 20px; }
      .lesson li { margin: 3px 0; font-size: 14px; color: #c7ccd6; }
      .lesson li b { color: #e8eaef; }
      .hud { position: absolute; top: 14px; left: 16px; display: flex; gap: 22px; pointer-events: none; }
      .hud div { display: flex; flex-direction: column; }
      .hud small { color: #8b93a1; font-size: 12px; }
      .hud b { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
      .song { position: absolute; top: 14px; right: 16px; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
      .song select { font: inherit; font-size: 14px; background: #151820; color: #e8eaef; border: 1px solid #262a33; border-radius: 8px; padding: 5px 8px; margin-bottom: 4px; max-width: 260px; }
      .song b { display: block; font-size: 16px; }
      .song small { color: #8b93a1; }
      #message {
        position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
        max-width: min(640px, calc(100% - 32px)); text-align: center;
        background: rgba(15, 17, 21, 0.82); border: 1px solid #262a33; border-radius: 12px;
        padding: 12px 18px; font-size: 16px;
      }
      #message small { display: block; color: #8b93a1; font-size: 13px; margin-top: 4px; }
      .progress { position: absolute; left: 16px; right: 16px; bottom: 10px; height: 6px; background: #1c2029; border-radius: 3px; overflow: hidden; }
      .progress span { display: block; height: 100%; width: 0; background: #60a5fa; }
      footer.credit { padding: 6px 16px; font-size: 12px; color: var(--dim); background: var(--panel); border-top: 1px solid var(--line); }
      footer.credit a { color: inherit; }
      @media (max-width: 560px) {
        header { padding: 10px 12px; gap: 8px; }
        h1 { font-size: 15px; }
        button, .btn { padding: 6px 10px; font-size: 14px; }
        .hide-sm { display: none; }
        .hud { gap: 14px; }
        .hud b { font-size: 20px; }
        .song b, .song small { display: none; }
        .song select { max-width: 150px; font-size: 13px; }
        .modes { top: 64px; }
        .modes button { padding: 5px 10px; font-size: 13px; }
        .practice { top: 112px; left: 8px; padding: 8px; font-size: 13px; }
        #score { height: 112px; }
      }
    </style>
    <script type="module" crossorigin src="./assets/conduct-D_jGZC6f.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/ble-C_Dz__IT.js">
    <link rel="modulepreload" crossorigin href="./assets/calib-DFslUjxI.js">
  </head>
  <body>
    <header>
      <h1>🎼 Air Band 지휘</h1>
      <button id="connect" class="primary">센서 연결</button>
      <button id="phone" title="보드 없이 이 폰을 지휘봉처럼 쥐기 (폰에서만)">📱 폰으로 지휘</button>
      <button id="axis" disabled title="키보드 A — 처음 한 번: 지휘봉 끝을 천장으로 세우고 가만히 든 채 누르기">① 축 맞추기</button>
      <button id="recenter" disabled title="키보드 C — 지휘봉을 정면(오케스트라 가운데)으로 겨누고 누르기">② 정면 맞추기</button>
      <button id="restart" title="키보드 R">처음부터</button>
      <span class="meta">상태 <b id="status" data-state="disconnected">연결 안 됨</b></span>
      <span class="spacer"></span>
      <a class="btn hide-sm" href="./">자유 연주</a>
      <a class="btn hide-sm" href="kit.html">드럼 키트</a>
      <a class="btn hide-sm" href="rhythm.html">리듬 게임</a>
    </header>
    <div id="support" hidden></div>
    <main id="stage">
     <div class="hallwrap">
      <canvas id="hall"></canvas>
      <div class="modes" role="group" aria-label="모드">
        <button id="mode-practice" aria-pressed="true">따라하기 연습</button>
        <button id="mode-live" aria-pressed="false">실전 지휘</button>
      </div>
      <div class="practice" id="practice">
        <label>템포 <input type="range" id="p-bpm" min="50" max="110" step="2" value="66" /> <b id="p-bpm-v">66</b></label>
        <label><input type="checkbox" id="p-music" checked /> 음악 같이 (끄면 메트로놈만)</label>
        <label><input type="checkbox" id="p-guide" checked /> 지휘 도형 공 보기</label>
        <button id="p-start">▶ 연습 시작 (Enter)</button>
      </div>
      <div class="judge" id="judge"></div>
      <div class="hud">
        <div><small>템포</small><b id="bpm">—</b></div>
        <div><small>셈여림</small><b id="dyn">—</b></div>
        <div><small>마디</small><b id="bar">—</b></div>
        <div title="지휘봉 끝의 위아래 각도 — 휘두를 때 크게 바뀌어야 박이 잡힙니다"><small>위아래</small><b id="elev">—</b></div>
        <div title="지금까지 잡힌 박 수"><small>박</small><b id="beats">0</b></div>
      </div>
      <div class="song">
        <select id="song" aria-label="곡 선택"></select>
        <b id="title"></b><small id="composer"></small>
      </div>
      <div id="message">불러오는 중…</div>
      <div class="progress"><span id="progress"></span></div>
     </div>
      <canvas id="score" aria-label="악보"></canvas>
    </main>
    <footer class="credit">
      악기 소리: FluidR3 GM (Frank Wen, MIT) ·
      <a href="https://github.com/gleitz/midi-js-soundfonts" target="_blank" rel="noopener">midi-js-soundfonts</a> (CC BY 3.0) ·
      곡: 퍼블릭 도메인 · <span id="about"></span>
    </footer>
  </body>
</html>
